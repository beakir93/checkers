<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Русские шашки в браузере: игра вдвоём или против компьютера." />
    <title>Русские шашки</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23a3332a'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23f2d9b8' stroke-width='2'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=PT+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>Шашки</h1>
        <button id="theme" class="icon-btn" type="button" aria-label="Сменить тему">◐</button>
      </header>

      <main class="layout">
        <section class="board-wrap" aria-label="Доска">
          <div class="player player--top" id="player-top"></div>
          <div class="board-frame">
            <div class="files files--top" aria-hidden="true"></div>
            <div class="ranks ranks--left" aria-hidden="true"></div>
            <div id="board" class="board" role="grid"></div>
            <div class="ranks ranks--right" aria-hidden="true"></div>
            <div class="files files--bottom" aria-hidden="true"></div>
          </div>
          <div class="player player--bottom" id="player-bottom"></div>
        </section>

        <aside class="panel">
          <p id="status" class="status" aria-live="polite"></p>

          <div class="controls">
            <label>
              Режим
              <select id="mode">
                <option value="ai">Против компьютера</option>
                <option value="pvp">Вдвоём</option>
              </select>
            </label>
            <label class="ai-only">
              Цвет
              <select id="side">
                <option value="w">Белые</option>
                <option value="b">Чёрные</option>
              </select>
            </label>
            <label class="ai-only">
              Сложность
              <select id="level">
                <option value="easy">Лёгкая</option>
                <option value="medium" selected>Средняя</option>
                <option value="hard">Сложная</option>
              </select>
              <span id="level-note" class="note">На этом уровне подсвечиваются шашки, которыми можно ходить.</span>
            </label>
          </div>

          <div class="actions">
            <button id="new" type="button" class="btn btn--primary">Новая партия</button>
            <button id="undo" type="button" class="btn">Отменить ход</button>
            <button id="flip" type="button" class="btn">Перевернуть</button>
          </div>

          <h2>Ходы</h2>
          <ol id="history" class="history"></ol>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
